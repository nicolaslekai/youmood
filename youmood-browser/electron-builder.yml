appId: com.nicolaslekai.youmood
productName: youmood
directories:
  output: dist
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
files:
  - "!node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/**"
  - "!node_modules/@img/sharp-{linux,win32,linuxmusl}*/**"
  - main.js
  - store.js
  - ai.js
  - inject/**
  - ui/**
  - ext/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
dmg:
  title: youmood
